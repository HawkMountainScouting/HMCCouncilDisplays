name: Update council calendar
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download ScoutCal JSON
        run: |
          python - <<'PY'
          import json, urllib.request, pathlib
          url = 'https://scoutcal.com/18768.json'
          req = urllib.request.Request(url, headers={'User-Agent':'HMC-Calendar-Display/1.0','Accept':'application/json'})
          with urllib.request.urlopen(req, timeout=40) as response:
              data = json.load(response)
          path = pathlib.Path('calendar/events.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(data, ensure_ascii=False), encoding='utf-8')
          print('Calendar JSON downloaded and validated')
          PY
      - name: Commit refreshed calendar data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add calendar/events.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh council calendar data'
            git push
          fi
